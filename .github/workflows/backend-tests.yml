name: CI & Safety Suite

on:
  push:
    branches:
      - main
      - "sanjay/**"
      - "pavan/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-and-benchmark:
    name: Backend Safety & Benchmark Suite
    runs-on: ubuntu-latest
    env:
      PROOFLOOP_LLM_PROVIDER: fallback
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run backend pytest suite
        working-directory: backend
        run: python -m pytest -v

      - name: Run benchmark CLI
        run: python -m benchmark.run --scenarios clean_recovery false_green hostile_log --trials 1 --seed 42 --output benchmark/results/ci.json

  frontend:
    name: Frontend Test & Build Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run frontend production build
        run: npm run build
