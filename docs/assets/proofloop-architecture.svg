<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">ProofLoop AI architecture</title><desc id="desc">Architecture diagram showing the dashboard, FastAPI orchestration, investigation and policy gates, synthetic simulator, independent verifier, SQLite audit trail, optional LLM provider, and dataset evaluation boundary.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1017"/><stop offset="1" stop-color="#131c27"/></linearGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1b2734"/><stop offset="1" stop-color="#111923"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7b9a9b"/></marker><style>.h{font:700 25px Arial,sans-serif;fill:#e6edf5}.sub{font:14px Arial,sans-serif;fill:#9aaaba}.label{font:700 16px Arial,sans-serif;fill:#e6edf5}.body{font:13px Arial,sans-serif;fill:#aab8c8}.tiny{font:12px Arial,sans-serif;fill:#8294a7}.line{stroke:#7b9a9b;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#8b8b72;stroke-width:1.8;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}.box{fill:url(#panel);stroke:#334354;stroke-width:1.5}.accent{fill:#162d30;stroke:#527e7b;stroke-width:1.5}.warn{fill:#2b2921;stroke:#8a7752;stroke-width:1.5}</style></defs>
<rect width="1200" height="760" rx="24" fill="url(#bg)"/>
<text x="48" y="56" class="h">ProofLoop AI — System Architecture</text><text x="48" y="82" class="sub">Evidence-led incident investigation • deterministic governance • independent recovery verification</text>
<rect x="48" y="112" width="1104" height="104" rx="14" class="box"/><text x="72" y="143" class="label">Operator Dashboard</text><text x="72" y="168" class="body">React · TypeScript · Vite</text><text x="72" y="191" class="tiny">Operations · Investigations · Incidents · Approvals · Topology · Benchmark · Analytics · Audit</text>
<path d="M600 216 V255" class="line"/>
<rect x="330" y="255" width="540" height="76" rx="14" class="accent"/><text x="600" y="284" text-anchor="middle" class="label">FastAPI Orchestration Layer</text><text x="600" y="307" text-anchor="middle" class="body">Typed API contracts · lifecycle events · approval workflow · SSE</text>
<path d="M600 331 V365 H205 V392" class="line"/><path d="M600 365 V392" class="line"/><path d="M600 365 H995 V392" class="line"/>
<rect x="48" y="392" width="314" height="112" rx="12" class="box"/><text x="205" y="422" text-anchor="middle" class="label">Investigation Engine</text><text x="205" y="447" text-anchor="middle" class="body">Symptoms · diagnostics</text><text x="205" y="469" text-anchor="middle" class="body">Competing hypotheses · evidence</text><text x="205" y="489" text-anchor="middle" class="tiny">Optional LLM proposal + fallback</text>
<rect x="443" y="392" width="314" height="112" rx="12" class="warn"/><text x="600" y="422" text-anchor="middle" class="label">Deterministic Policy Gate</text><text x="600" y="447" text-anchor="middle" class="body">Allow · require approval · block</text><text x="600" y="469" text-anchor="middle" class="body">Scope and tool authorization</text><text x="600" y="489" text-anchor="middle" class="tiny">LLM suggestions never authorize actions</text>
<rect x="838" y="392" width="314" height="112" rx="12" class="box"/><text x="995" y="422" text-anchor="middle" class="label">Independent Verifier</text><text x="995" y="447" text-anchor="middle" class="body">Synthetic probes · observation window</text><text x="995" y="469" text-anchor="middle" class="body">Dependency/config checks</text><text x="995" y="489" text-anchor="middle" class="tiny">Recovery is proven, not assumed</text>
<path d="M362 448 H443" class="line"/><path d="M757 448 H838" class="line"/><path d="M600 504 V543 H330 V566" class="line"/><path d="M600 543 H870 V566" class="line"/>
<rect x="100" y="566" width="460" height="112" rx="12" class="box"/><text x="330" y="596" text-anchor="middle" class="label">Controlled Synthetic Simulator</text><text x="330" y="622" text-anchor="middle" class="body">Bounded remediation tools · fault scenarios</text><text x="330" y="645" text-anchor="middle" class="tiny">No production infrastructure mutations</text>
<rect x="640" y="566" width="460" height="112" rx="12" class="box"/><text x="870" y="596" text-anchor="middle" class="label">SQLite Evidence &amp; Audit Store</text><text x="870" y="622" text-anchor="middle" class="body">Incident state · event history · approvals</text><text x="870" y="645" text-anchor="middle" class="tiny">Persistent records and reproducible traces</text>
<text x="48" y="720" class="tiny">Dataset evaluation is a separate read-only path with evaluator ground truth isolated from agent-visible inputs.</text>
</svg>